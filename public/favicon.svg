<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#6ec8ff"/>
			<stop offset="1" stop-color="#2b97e3"/>
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#sky)"/>
	<g stroke="#17324d" stroke-width="2.6" stroke-linejoin="round">
		<!-- head -->
		<ellipse cx="32" cy="39" rx="22" ry="20" fill="#23252e"/>
		<!-- face mask -->
		<path d="M14.5 42 C14 31 22 27 32 31 C42 27 50 31 49.5 42 C49 52 41 57 32 57 C23 57 15 52 14.5 42 Z" fill="#fff" stroke="none"/>
		<!-- beanie -->
		<path d="M11 27 C11 11 53 11 53 27 Z" fill="#f0435a"/>
		<rect x="9" y="23.5" width="46" height="8" rx="4" fill="#ff6f86"/>
		<circle cx="32" cy="9" r="5.5" fill="#fff"/>
	</g>
	<!-- eyes -->
	<ellipse cx="24.5" cy="41" rx="4" ry="4.8" fill="#15151c"/>
	<ellipse cx="39.5" cy="41" rx="4" ry="4.8" fill="#15151c"/>
	<circle cx="26" cy="39.2" r="1.6" fill="#fff"/>
	<circle cx="41" cy="39.2" r="1.6" fill="#fff"/>
	<!-- cheeks -->
	<ellipse cx="18.5" cy="48" rx="3.2" ry="2" fill="#ff9fb5"/>
	<ellipse cx="45.5" cy="48" rx="3.2" ry="2" fill="#ff9fb5"/>
	<!-- beak -->
	<path d="M27.5 46.5 L36.5 46.5 L32 52.5 Z" fill="#ff9b2f" stroke="#c96a12" stroke-width="1" stroke-linejoin="round"/>
</svg>
